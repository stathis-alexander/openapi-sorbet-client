openapi: 3.0.3
info: { title: Ops, version: "1" }
servers: [{ url: https://example.com }]
paths:
  /pets/{petId}:
    get:
      operationId: get-pet
      summary: Fetch a pet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          description: Pet identifier
          schema: { type: string }
        - name: $filter
          in: query
          schema: { type: string }
        - name: Authorization
          in: header
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: bad
    post:
      operationId: create-pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "204":
          description: no content
        default:
          description: unexpected
  /health:
    get:
      operationId: get-health
      responses:
        "200":
          description: healthy
  /ping:
    get:
      operationId: get-ping
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                type: string
  /file:
    get:
      operationId: get-file
      responses:
        "200":
          description: binary blob
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /optional-pet:
    post:
      operationId: post-optional-pet
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "204":
          description: no content
components:
  schemas:
    Pet:
      type: object
      properties:
        Name: { type: string }
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: IntegratorKey
      in: header
      description: Integrator API key
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: []
  - apiKeyQuery: []
